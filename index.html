<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>מאגר טיפים - GimlaTech</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
* { box-sizing: border-box; }
body { font-family: 'Heebo', sans-serif; background: #bfdbee; -webkit-tap-highlight-color: transparent; margin: 0; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.step-fade { animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-spin { animation: spin 1s linear infinite; }
@keyframes pulseLogo { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.85; } }
.loader-logo { animation: pulseLogo 1.6s ease-in-out infinite; }
.btn-3d { border-bottom-width: 4px !important; transition: transform 0.08s ease, border-bottom-width 0.08s ease; }
.btn-3d:active { transform: translateY(3px); border-bottom-width: 1px !important; }
.btn-3d-header { border-bottom: 3px solid rgba(0,0,0,0.25) !important; transition: transform 0.08s ease, border-bottom-width 0.08s ease; }
.btn-3d-header:active { transform: translateY(2px); border-bottom-width: 0px !important; margin-top: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

// ════════ הגדרות ════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyy4Hwek6_Rx6wV8Ax9VluMnG4xJ4TO5RLrAvDtSUgWhwDb9rcNBceDhxrmA1xSk-fk/exec';
const GOOGLE_CLIENT_ID = '882763453521-junm9rvoi5et71i4u03igoo211cfg225.apps.googleusercontent.com';

const CATS = [
  { key:"basics", label:"יסודות" }, { key:"whatsapp", label:"וואטסאפ" },
  { key:"android", label:"אנדרואיד" }, { key:"iphone", label:"אייפון" },
  { key:"gmail", label:"מייל" }, { key:"camera", label:"צילום" },
  { key:"nav", label:"ניווט" }, { key:"zoom", label:"זום" },
  { key:"ai", label:"AI" }, { key:"banking", label:"בנקאות" },
  { key:"health", label:"בריאות" }, { key:"photos", label:"תמונות" },
  { key:"accessibility", label:"נגישות" },
  { key:"scams", label:"הונאות ברשת" },
  { key:"other", label:"אחר" },
];
const PLATFORMS = [{key:"all",label:"הכל"},{key:"android",label:"אנדרואיד"},{key:"iphone",label:"אייפון"}];
const DIFFICULTIES = [{key:"קל",label:"קל"},{key:"בינוני",label:"בינוני"},{key:"מתקדם",label:"מתקדם"}];
const catLabel = k => (CATS.find(c=>c.key===k)||{}).label || k;
const CAT_BY_LABEL = Object.fromEntries(CATS.map(c => [c.label, c.key]));

const URL_RE = /(https?:\/\/[^\s]+)/g;
const isUrl = s => /^https?:\/\//.test(s);
function Linkify({ text }) {
  if (!text) return null;
  const parts = String(text).split(URL_RE);
  return parts.map((part, i) =>
    isUrl(part) ? <a key={i} href={part} target="_blank" rel="noopener" className="text-sky-700 underline break-all" onClick={e=>e.stopPropagation()}>{part}</a> : <React.Fragment key={i}>{part}</React.Fragment>
  );
}

function api(sub, params, method, body) {
  let url = APPS_SCRIPT_URL + '?action=tips&sub=' + sub;
  Object.keys(params||{}).forEach(k => { url += '&' + k + '=' + encodeURIComponent(params[k]); });
  const opts = { method: method || 'GET' };
  if (body) { opts.method = 'POST'; opts.body = JSON.stringify(body); }
  return fetch(url, opts).then(r => r.json());
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ════════ מסך כניסה למורשים ════════
function LoginModal({ onClose, onLoggedIn }) {
  const [status, setStatus] = useState('');
  const [err, setErr] = useState('');

  const verifyEmail = (email, name) => {
    setStatus('בודקת הרשאות עבור ' + email + '...');
    api('getRole', { email }).then(res => {
      if (res.role === 'מעלה' || res.role === 'מאשר') {
        const session = { email, name: name || email, role: res.role };
        localStorage.setItem('tips_session', JSON.stringify(session));
        onLoggedIn(session);
      } else {
        setStatus('');
        setErr('כתובת המייל הזו לא מורשית. פני למנהל המערכת להוספה.');
      }
    }).catch(() => { setStatus(''); setErr('שגיאת תקשורת, נסי שוב'); });
  };

  const handleCredential = (response) => {
    try {
      const parts = response.credential.split('.');
      const payload = JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
      verifyEmail((payload.email||'').toLowerCase().trim(), payload.name);
    } catch(e) { setErr('שגיאה בקריאת פרטי המשתמש. נסי שוב.'); }
  };

  const fetchUserInfo = (accessToken) => {
    fetch('https://www.googleapis.com/oauth2/v2/userinfo', { headers: { Authorization: 'Bearer ' + accessToken } })
      .then(r => r.json())
      .then(info => verifyEmail((info.email||'').toLowerCase().trim(), info.name))
      .catch(() => setErr('לא ניתן לאמת. בדקי חיבור ונסי שוב.'));
  };

  const startSignIn = () => {
    setErr(''); setStatus('פותחת חלון כניסה...');
    if (!window.google || !window.google.accounts) { setErr('שירות Google לא נטען, נסי שוב'); setStatus(''); return; }
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredential, auto_select: false, ux_mode: 'popup' });
    google.accounts.id.prompt((notification) => {
      if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
        google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile',
          callback: (tokenResponse) => { if (tokenResponse.access_token) fetchUserInfo(tokenResponse.access_token); else setStatus(''); }
        }).requestAccessToken();
      }
    });
  };

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 px-6">
      <div className="bg-white rounded-2xl p-6 shadow-2xl max-w-xs w-full text-center">
        <h3 className="font-extrabold text-lg text-blue-900 mb-1">כניסת מורשים</h3>
        <p className="text-xs text-gray-500 mb-4">התחברי עם חשבון Google שלך — תיזכרי אוטומטית בפעם הבאה</p>
        <button onClick={startSignIn} className="w-full mb-3 py-3 rounded-full font-bold text-white border-2 border-blue-900 btn-3d flex items-center justify-center gap-2" style={{background:"#0284c7"}}>
          <span>G</span> התחברי עם Google
        </button>
        {status && <p className="text-sky-700 text-sm mb-2">{status}</p>}
        {err && <p className="text-red-500 text-sm mb-3">{err}</p>}
        <button onClick={onClose} className="w-full py-2.5 rounded-full font-bold border-2 border-gray-300 text-gray-600 btn-3d">ביטול</button>
      </div>
    </div>
  );
}

// ════════ טופס הוספת טיפ ════════
function SubmitTipForm({ session, onDone }) {
  const [submitterName, setSubmitterName] = useState(() => localStorage.getItem('tips_submitter_name') || session.name || '');
  const [name, setName] = useState('');
  const [essence, setEssence] = useState('');
  const [category, setCategory] = useState(CATS[0].key);
  const [platform, setPlatform] = useState('all');
  const [difficulty, setDifficulty] = useState('קל');
  const [steps, setSteps] = useState(['']);
  const [uses, setUses] = useState('');
  const [file, setFile] = useState(null);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  const updateStep = (i, v) => { const s=[...steps]; s[i]=v; setSteps(s); };
  const addStep = () => setSteps([...steps, '']);
  const removeStep = i => setSteps(steps.filter((_,idx)=>idx!==i));

  const submit = async () => {
    if (!submitterName.trim() || !name.trim() || !essence.trim() || steps.filter(s=>s.trim()).length===0) {
      setMsg('נא למלא לפחות שם מציע, שם טיפ, מהות ושלב אחד'); return;
    }
    setSaving(true); setMsg('');
    localStorage.setItem('tips_submitter_name', submitterName.trim());
    let infographicBase64 = null, infographicName = '';
    if (file) { infographicBase64 = await fileToBase64(file); infographicName = file.name; }
    api('submit', {}, 'POST', {
      email: session.email, submitterName: submitterName.trim(),
      name: name.trim(), essence: essence.trim(), category, platform, difficulty,
      steps: steps.filter(s=>s.trim()), uses: uses.trim(),
      infographicBase64, infographicName
    }).then(res => {
      setSaving(false);
      if (res.ok) { setMsg('✓ הטיפ נשלח לאישור, תודה!'); setName(''); setEssence(''); setSteps(['']); setUses(''); setFile(null); if(onDone) onDone(); }
      else setMsg('שגיאה: ' + (res.error||'')); 
    }).catch(()=>{ setSaving(false); setMsg('שגיאת תקשורת'); });
  };

  return (
    <div className="p-4 space-y-3">
      <h3 className="font-extrabold text-lg text-gray-800">הוספת טיפ חדש</h3>
      <input placeholder="שם המציע/ה" value={submitterName} onChange={e=>setSubmitterName(e.target.value)}
        className="w-full p-3 rounded-xl border-2 border-sky-300 focus:outline-none focus:border-sky-600 font-semibold" />
      <input placeholder="שם הטיפ" value={name} onChange={e=>setName(e.target.value)}
        className="w-full p-3 rounded-xl border-2 border-sky-300 focus:outline-none focus:border-sky-600 font-semibold" />
      <textarea placeholder="מהות - תיאור קצר של הטיפ" value={essence} onChange={e=>setEssence(e.target.value)}
        rows={2} className="w-full p-3 rounded-xl border-2 border-sky-300 focus:outline-none focus:border-sky-600" />
      <div className="grid grid-cols-3 gap-2">
        <select value={category} onChange={e=>setCategory(e.target.value)} className="p-3 rounded-xl border-2 border-sky-300 text-sm">
          {CATS.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
        </select>
        <select value={platform} onChange={e=>setPlatform(e.target.value)} className="p-3 rounded-xl border-2 border-sky-300 text-sm">
          {PLATFORMS.map(p=><option key={p.key} value={p.key}>{p.label}</option>)}
        </select>
        <select value={difficulty} onChange={e=>setDifficulty(e.target.value)} className="p-3 rounded-xl border-2 border-sky-300 text-sm">
          {DIFFICULTIES.map(d=><option key={d.key} value={d.key}>{d.label}</option>)}
        </select>
      </div>
      <div>
        <p className="font-bold text-sm text-gray-600 mb-1">שלבי עבודה</p>
        {steps.map((s,i)=>(
          <div key={i} className="flex gap-2 mb-2">
            <input value={s} onChange={e=>updateStep(i,e.target.value)} placeholder={"שלב " + (i+1)}
              className="flex-1 p-2.5 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-sky-600" />
            {steps.length>1 && <button onClick={()=>removeStep(i)} className="px-3 rounded-xl bg-red-50 text-red-500 font-bold btn-3d border border-b-red-300 border-red-200">✕</button>}
          </div>
        ))}
        <button onClick={addStep} className="text-sky-600 font-bold text-sm">+ הוספת שלב</button>
      </div>
      <textarea placeholder="שימושים אפשריים (חופשי)" value={uses} onChange={e=>setUses(e.target.value)}
        rows={2} className="w-full p-3 rounded-xl border-2 border-sky-300 focus:outline-none focus:border-sky-600" />
      <div>
        <p className="font-bold text-sm text-gray-600 mb-1">אינפוגרפיקה (PDF, קובץ קליל - לא חובה)</p>
        <input type="file" accept="application/pdf" onChange={e=>setFile(e.target.files[0])} className="text-sm" />
      </div>
      {msg && <p className="text-sm font-bold text-center text-sky-700">{msg}</p>}
      <button onClick={submit} disabled={saving}
        className="w-full py-3 rounded-xl font-extrabold text-white border border-b-blue-900 border-sky-600 btn-3d" style={{background:"#0284c7"}}>
        {saving ? 'שולח...' : 'שליחה לאישור'}
      </button>
    </div>
  );
}

function ExcelImport({ session }) {
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [fileName, setFileName] = useState('');
  const [defaultSubmitter, setDefaultSubmitter] = useState(() => localStorage.getItem('tips_submitter_name') || '');

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setFileName(file.name); setMsg(''); setBusy(true);
    localStorage.setItem('tips_submitter_name', defaultSubmitter.trim());

    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        const tips = rows.map(r => {
          const stepsRaw = String(r['שלבי עבודה'] || '');
          const steps = stepsRaw.split(/;|\n/).map(s => s.trim()).filter(Boolean);
          const catLabelIn = String(r['קטגוריה'] || '').trim();
          return {
            name: String(r['שם'] || '').trim(),
            essence: String(r['מהות'] || '').trim(),
            steps,
            uses: String(r['שימושים אפשריים'] || '').trim(),
            submitterName: String(r['שם המציע'] || defaultSubmitter || session.name || session.email).trim(),
            category: CAT_BY_LABEL[catLabelIn] || 'other',
            difficulty: DIFFICULTIES.find(d => d.key === String(r['רמת קושי']||'').trim()) ? String(r['רמת קושי']).trim() : 'קל',
          };
        }).filter(t => t.name && t.essence && t.steps.length);

        if (!tips.length) { setBusy(false); setMsg('לא נמצאו שורות תקינות בקובץ'); return; }

        api('importExcelRows', {}, 'POST', { email: session.email, tips }).then(res => {
          setBusy(false);
          if (res.ok) { setMsg(`✓ יובאו ${res.count} טיפים ונשלחו לתור האישורים`); setFileName(''); }
          else setMsg('שגיאה: ' + (res.error || ''));
        }).catch(() => { setBusy(false); setMsg('שגיאת תקשורת'); });
      } catch (err) {
        setBusy(false); setMsg('שגיאה בקריאת הקובץ: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  return (
    <div className="p-4 space-y-3">
      <h3 className="font-extrabold text-lg text-blue-900">ייבוא טיפים מקובץ אקסל</h3>
      <p className="text-sm text-gray-500">בחרי קובץ xlsx עם העמודות: מהות, שם, שלבי עבודה (מופרדים בנקודה-פסיק ; או בשורה חדשה), שימושים אפשריים, שם המציע, קטגוריה, רמת קושי.</p>
      <div>
        <p className="font-bold text-sm text-gray-600 mb-1">שם ברירת מחדל למציע (כשעמודת "שם המציע" ריקה בקובץ)</p>
        <input value={defaultSubmitter} onChange={e=>setDefaultSubmitter(e.target.value)} placeholder="לדוגמה: דני פליס"
          className="w-full p-2.5 rounded-xl border-2 border-sky-300 focus:outline-none focus:border-sky-600 text-sm" />
      </div>
      <input type="file" accept=".xlsx,.xls" onChange={handleFile} disabled={busy} className="text-sm" />
      {fileName && <p className="text-xs text-gray-400">קובץ: {fileName}</p>}
      {busy && <p className="text-sm text-center text-sky-700">מייבאת...</p>}
      {msg && <p className="text-sm font-bold text-center text-sky-700">{msg}</p>}
    </div>
  );
}

// ════════ תור אישורים ════════
function ApprovalQueue({ session }) {
  const [pending, setPending] = useState(null);
  const [notes, setNotes] = useState({});
  const [stats, setStats] = useState(null);
  const [bulkBusy, setBulkBusy] = useState(false);
  const [selected, setSelected] = useState({});

  const load = () => api('pending', { email: session.email }).then(res => setPending(res.tips || []));
  useEffect(() => {
    load();
    api('getStats', {}).then(res => setStats(res.stats)).catch(()=>{});
  }, []);

  const decide = (id, decision) => {
    api('decide', {}, 'POST', { email: session.email, approverName: session.name || session.email, id, decision, note: notes[id]||'' })
      .then(() => load());
  };

  const toggleSelect = (id) => setSelected(s => ({ ...s, [id]: !s[id] }));
  const selectedIds = Object.keys(selected).filter(id => selected[id]);

  const approveAll = async () => {
    if (!pending || !pending.length) return;
    if (!window.confirm(`לאשר את כל ${pending.length} הטיפים הממתינים?`)) return;
    setBulkBusy(true);
    for (const t of pending) {
      await api('decide', {}, 'POST', { email: session.email, approverName: session.name || session.email, id: t.id, decision: 'approve', note: notes[t.id]||'' });
    }
    setBulkBusy(false);
    setSelected({});
    load();
  };

  const approveSelected = async () => {
    if (!selectedIds.length) return;
    if (!window.confirm(`לאשר ${selectedIds.length} טיפים נבחרים?`)) return;
    setBulkBusy(true);
    for (const id of selectedIds) {
      await api('decide', {}, 'POST', { email: session.email, approverName: session.name || session.email, id, decision: 'approve', note: notes[id]||'' });
    }
    setBulkBusy(false);
    setSelected({});
    load();
  };

  if (pending === null) return <p className="p-6 text-center text-gray-400">טוען...</p>;

  return (
    <div className="p-4 space-y-3">
      {stats && (
        <div className="bg-white rounded-2xl border border-gray-200 p-3 shadow-sm flex justify-around text-center">
          <div>
            <p className="text-xs text-gray-400">כניסות מורשים</p>
            <p className="font-extrabold text-lg text-sky-700">{stats.auth}</p>
          </div>
          <div>
            <p className="text-xs text-gray-400">כניסות אנונימיות</p>
            <p className="font-extrabold text-lg text-sky-700">{stats.anon}</p>
          </div>
        </div>
      )}
      {pending.length === 0 ? (
        <p className="p-6 text-center text-gray-400">אין טיפים הממתינים לאישור כרגע 🎉</p>
      ) : (
      <>
      <h3 className="font-extrabold text-lg text-gray-800 flex items-center justify-between flex-wrap gap-2">
        <span>טיפים הממתינים לאישור ({pending.length})</span>
        <div className="flex gap-2">
          {selectedIds.length > 0 && (
            <button onClick={approveSelected} disabled={bulkBusy}
              className="text-xs px-3 py-1.5 rounded-full font-bold text-white btn-3d border border-b-sky-800 border-sky-600" style={{background:"#0284c7"}}>
              {bulkBusy ? 'מאשרת...' : `אשר נבחרים (${selectedIds.length})`}
            </button>
          )}
          <button onClick={approveAll} disabled={bulkBusy}
            className="text-xs px-3 py-1.5 rounded-full font-bold text-white btn-3d border border-b-green-800 border-green-600" style={{background:"#16a34a"}}>
            {bulkBusy ? 'מאשרת...' : 'אשר הכל'}
          </button>
        </div>
      </h3>
      {pending.map(t => (
        <div key={t.id} className="bg-white rounded-2xl border border-gray-200 p-4 shadow-sm space-y-2">
          <label className="flex items-start gap-2 cursor-pointer">
            <input type="checkbox" checked={!!selected[t.id]} onChange={()=>toggleSelect(t.id)}
              className="mt-1.5 w-5 h-5 accent-sky-600 shrink-0" />
            <p className="font-extrabold text-gray-800">{t.name} <span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md">{catLabel(t.category)}</span></p>
          </label>
          <p className="text-sm text-gray-600"><Linkify text={t.essence} /></p>
          <ol className="list-decimal pr-5 text-sm text-gray-700 space-y-1">
            {t.steps.map((s,i)=><li key={i}><Linkify text={s} /></li>)}
          </ol>
          {t.uses && <p className="text-sm text-gray-500"><b>שימושים:</b> <Linkify text={t.uses} /></p>}
          <p className="text-xs text-gray-400">מציע/ה: {t.submitter} ({t.email})</p>
          {t.infographicUrl && <a href={t.infographicUrl} target="_blank" className="text-xs text-blue-600 underline">קובץ אינפוגרפיקה מצורף</a>}
          <input placeholder="הערה (לא חובה)" value={notes[t.id]||''} onChange={e=>setNotes({...notes,[t.id]:e.target.value})}
            className="w-full p-2 rounded-lg border border-gray-200 text-sm" />
          <div className="flex gap-2">
            <button onClick={()=>decide(t.id,'approve')} className="flex-1 py-2 rounded-xl font-bold text-white btn-3d border border-b-green-800 border-green-600" style={{background:"#16a34a"}}>אשר</button>
            <button onClick={()=>decide(t.id,'reject')} className="flex-1 py-2 rounded-xl font-bold text-white btn-3d border border-b-red-800 border-red-600" style={{background:"#dc2626"}}>דחה</button>
          </div>
        </div>
      ))}
      </>
      )}
    </div>
  );
}

// ════════ ניהול טיפים (עריכה/מחיקה) ════════
function ManageTips({ session }) {
  const [tips, setTips] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(null);
  const [saving, setSaving] = useState(false);
  const [selected, setSelected] = useState({});
  const [bulkBusy, setBulkBusy] = useState(false);

  const load = () => api('approved', {}).then(res => setTips(res.tips || []));
  useEffect(() => { load(); }, []);

  const toggleSelect = (id) => setSelected(s => ({ ...s, [id]: !s[id] }));
  const selectedIds = Object.keys(selected).filter(id => selected[id]);
  const selectAll = () => setSelected(Object.fromEntries(tips.map(t => [t.id, true])));
  const clearSelection = () => setSelected({});

  const deleteSelected = async () => {
    if (!selectedIds.length) return;
    if (!window.confirm(`למחוק לצמיתות ${selectedIds.length} טיפים נבחרים?`)) return;
    setBulkBusy(true);
    for (const id of selectedIds) {
      await api('deleteTip', {}, 'POST', { email: session.email, id });
    }
    setBulkBusy(false);
    setSelected({});
    load();
  };

  const startEdit = (t) => {
    setEditingId(t.id);
    setForm({ name: t.name, essence: t.essence, category: t.category, difficulty: t.difficulty || 'קל',
      stepsText: (t.steps || []).join('\n'), uses: t.uses || '' });
  };
  const cancelEdit = () => { setEditingId(null); setForm(null); };

  const saveEdit = (id) => {
    setSaving(true);
    api('updateTip', {}, 'POST', {
      email: session.email, id,
      name: form.name.trim(), essence: form.essence.trim(), category: form.category,
      difficulty: form.difficulty, uses: form.uses.trim(),
      steps: form.stepsText.split('\n').map(s=>s.trim()).filter(Boolean)
    }).then(res => {
      setSaving(false);
      if (res.ok) { cancelEdit(); load(); }
      else alert('שגיאה: ' + (res.error||''));
    }).catch(()=>{ setSaving(false); alert('שגיאת תקשורת'); });
  };

  const removeTip = (id, name) => {
    if (!window.confirm(`למחוק לצמיתות את הטיפ "${name}"?`)) return;
    api('deleteTip', {}, 'POST', { email: session.email, id }).then(res => {
      if (res.ok) load();
      else alert('שגיאה: ' + (res.error||''));
    }).catch(()=>alert('שגיאת תקשורת'));
  };

  if (tips === null) return <p className="p-6 text-center text-gray-400">טוען...</p>;
  if (tips.length === 0) return <p className="p-6 text-center text-gray-400">אין עדיין טיפים מאושרים</p>;

  return (
    <div className="p-4 space-y-3">
      <h3 className="font-extrabold text-lg text-gray-800 flex items-center justify-between flex-wrap gap-2">
        <span>ניהול טיפים מאושרים ({tips.length})</span>
        <div className="flex gap-2">
          <button onClick={selectAll}
            className="text-xs px-3 py-1.5 rounded-full font-bold border-2 border-sky-600 text-sky-700 btn-3d">בחר הכל</button>
          {selectedIds.length > 0 && (
            <button onClick={clearSelection}
              className="text-xs px-3 py-1.5 rounded-full font-bold border-2 border-gray-300 text-gray-600 btn-3d">נקה בחירה</button>
          )}
          {selectedIds.length > 0 && (
            <button onClick={deleteSelected} disabled={bulkBusy}
              className="text-xs px-3 py-1.5 rounded-full font-bold text-white btn-3d border border-b-red-800 border-red-600" style={{background:"#dc2626"}}>
              {bulkBusy ? 'מוחקת...' : `מחק נבחרים (${selectedIds.length})`}
            </button>
          )}
        </div>
      </h3>
      {tips.map(t => (
        <div key={t.id} className="bg-white rounded-2xl border border-gray-200 p-4 shadow-sm space-y-2">
          {editingId === t.id ? (
            <div className="space-y-2">
              <input value={form.name} onChange={e=>setForm({...form, name:e.target.value})}
                className="w-full p-2 rounded-lg border-2 border-sky-300 font-bold text-sm" placeholder="שם הטיפ" />
              <textarea value={form.essence} onChange={e=>setForm({...form, essence:e.target.value})}
                rows={2} className="w-full p-2 rounded-lg border-2 border-sky-300 text-sm" placeholder="מהות" />
              <div className="grid grid-cols-2 gap-2">
                <select value={form.category} onChange={e=>setForm({...form, category:e.target.value})} className="p-2 rounded-lg border-2 border-sky-300 text-sm">
                  {CATS.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
                </select>
                <select value={form.difficulty} onChange={e=>setForm({...form, difficulty:e.target.value})} className="p-2 rounded-lg border-2 border-sky-300 text-sm">
                  {DIFFICULTIES.map(d=><option key={d.key} value={d.key}>{d.label}</option>)}
                </select>
              </div>
              <textarea value={form.stepsText} onChange={e=>setForm({...form, stepsText:e.target.value})}
                rows={4} className="w-full p-2 rounded-lg border-2 border-gray-200 text-sm" placeholder="שלבי עבודה - שורה לכל שלב" />
              <textarea value={form.uses} onChange={e=>setForm({...form, uses:e.target.value})}
                rows={2} className="w-full p-2 rounded-lg border-2 border-sky-300 text-sm" placeholder="שימושים אפשריים" />
              <div className="flex gap-2">
                <button onClick={()=>saveEdit(t.id)} disabled={saving}
                  className="flex-1 py-2 rounded-xl font-bold text-white btn-3d border border-b-blue-900 border-sky-600" style={{background:"#0284c7"}}>
                  {saving ? 'שומרת...' : 'שמור'}
                </button>
                <button onClick={cancelEdit} className="flex-1 py-2 rounded-xl font-bold border-2 border-gray-300 text-gray-600 btn-3d">ביטול</button>
              </div>
            </div>
          ) : (
            <>
              <label className="flex items-start gap-2 cursor-pointer">
                <input type="checkbox" checked={!!selected[t.id]} onChange={()=>toggleSelect(t.id)}
                  className="mt-1.5 w-5 h-5 accent-red-600 shrink-0" />
                <p className="font-extrabold text-gray-800">{t.name} <span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md">{catLabel(t.category)}</span></p>
              </label>
              <p className="text-sm text-gray-600"><Linkify text={t.essence} /></p>
              <div className="flex gap-2">
                <button onClick={()=>startEdit(t)} className="flex-1 py-2 rounded-xl font-bold text-white btn-3d border border-b-blue-900 border-sky-600" style={{background:"#0284c7"}}>ערוך</button>
                <button onClick={()=>removeTip(t.id, t.name)} className="flex-1 py-2 rounded-xl font-bold text-white btn-3d border border-b-red-800 border-red-600" style={{background:"#dc2626"}}>מחק</button>
              </div>
            </>
          )}
        </div>
      ))}
    </div>
  );
}

function LoadingScreen() {
  return (
    <div className="flex-1 flex flex-col items-center justify-center py-16 px-6 text-center">
      {GIMLATECH_LOGO_URL ? (
        <img src={GIMLATECH_LOGO_URL} alt="GimlaTech" className="loader-logo w-20 h-20 object-contain mb-4" />
      ) : (
        <div className="loader-logo text-6xl mb-4">💡</div>
      )}
      <div className="loader-spin w-10 h-10 rounded-full border-4 border-sky-200 border-t-sky-600 mb-4"></div>
      <p className="text-blue-900 font-bold text-lg">טוענים את מאגר הטיפים...</p>
      <p className="text-gray-400 text-sm mt-1">רק רגע, זה לא אמור לקחת הרבה זמן</p>
      <p className="text-sky-700 font-bold text-sm mt-4">אנחנו כאן בשבילכם, גימלאטק 🧡</p>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(() => { try { return JSON.parse(localStorage.getItem('tips_session')); } catch(e){ return null; } });
  const [showLogin, setShowLogin] = useState(false);
  const [tab, setTab] = useState('browse');
  const [approvedRemote, setApprovedRemote] = useState([]);
  const [loadingTips, setLoadingTips] = useState(true);
  const [selectedCat, setSelectedCat] = useState(null);
  const [selectedSubmitter, setSelectedSubmitter] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [expanded, setExpanded] = useState(null);

  useEffect(() => { api('approved', {}).then(res => setApprovedRemote(res.tips || [])).catch(()=>{}).finally(()=>setLoadingTips(false)); }, [tab]);
  useEffect(() => { api('logVisit', { type: session ? 'auth' : 'anon' }).catch(()=>{}); }, []);

  const allTips = useMemo(() => approvedRemote, [approvedRemote]);

  const submitters = useMemo(() => {
    const names = Array.from(new Set(allTips.map(t => t.submitter).filter(Boolean)));
    return names.sort((a,b) => a.localeCompare(b, 'he'));
  }, [allTips]);

  const fuse = useMemo(() => new Fuse(allTips, { keys: ['name','essence','uses'], threshold: 0.35 }), [allTips]);

  const filtered = useMemo(() => {
    let list = allTips;
    if (searchQuery.trim()) list = fuse.search(searchQuery).map(r=>r.item);
    else if (selectedCat) list = list.filter(t => t.category === selectedCat);
    if (selectedSubmitter) list = list.filter(t => t.submitter === selectedSubmitter);
    return list;
  }, [allTips, searchQuery, selectedCat, selectedSubmitter, fuse]);

  const logout = () => { localStorage.removeItem('tips_session'); setSession(null); setTab('browse'); };

  return (
    <div className="min-h-screen flex flex-col">
      <header className="text-white p-4 sticky top-0 z-20" style={{background:"linear-gradient(160deg,#0c2461 0%,#1a4d8a 50%,#0284c7 100%)"}}>
        <div className="flex items-center justify-between mb-1">
          <span className="font-extrabold text-xl tracking-tight">💡 מאגר טיפים</span>
          {session ? (
            <button onClick={logout} className="text-xs bg-white/15 border-2 border-white/40 px-3 py-1.5 rounded-full btn-3d-header">{session.name || session.email} ({session.role}) · יציאה</button>
          ) : (
            <button onClick={()=>setShowLogin(true)} className="text-xs bg-white/15 border-2 border-white/40 px-3 py-1.5 rounded-full btn-3d-header">כניסת מורשים</button>
          )}
        </div>
        {session && (
          <div className="flex gap-2 mt-2">
            <button onClick={()=>setTab('browse')} className={`px-3 py-1.5 rounded-full text-sm font-bold border-2 ${tab==='browse'?'bg-white text-sky-700 border-white':'bg-white/10 border-white/40'}`}>עיון</button>
            <button onClick={()=>setTab('submit')} className={`px-3 py-1.5 rounded-full text-sm font-bold border-2 ${tab==='submit'?'bg-white text-sky-700 border-white':'bg-white/10 border-white/40'}`}>הוספת טיפ</button>
            {session.role==='מאשר' && <button onClick={()=>setTab('whatsapp')} className={`px-3 py-1.5 rounded-full text-sm font-bold border-2 ${tab==='whatsapp'?'bg-white text-sky-700 border-white':'bg-white/10 border-white/40'}`}>ייבוא מאקסל</button>}
            {session.role==='מאשר' && <button onClick={()=>setTab('approve')} className={`px-3 py-1.5 rounded-full text-sm font-bold border-2 ${tab==='approve'?'bg-white text-sky-700 border-white':'bg-white/10 border-white/40'}`}>אישורים</button>}
            {session.role==='מאשר' && <button onClick={()=>setTab('manage')} className={`px-3 py-1.5 rounded-full text-sm font-bold border-2 ${tab==='manage'?'bg-white text-sky-700 border-white':'bg-white/10 border-white/40'}`}>ניהול טיפים</button>}
          </div>
        )}
        {tab === 'browse' && selectedCat && (
          <div className="mt-2">
            <button onClick={()=>setSelectedCat(null)}
              className="text-xs bg-white text-sky-700 font-bold px-3 py-1.5 rounded-full btn-3d-header flex items-center gap-1">
              <span>✕</span> יציאה מקטגוריית "{catLabel(selectedCat)}"
            </button>
          </div>
        )}
        {tab === 'browse' && selectedSubmitter && (
          <div className="mt-2">
            <button onClick={()=>setSelectedSubmitter('')}
              className="text-xs bg-white text-sky-700 font-bold px-3 py-1.5 rounded-full btn-3d-header flex items-center gap-1">
              <span>✕</span> יציאה מסינון מציע/ה "{selectedSubmitter}"
            </button>
          </div>
        )}
      </header>

      {showLogin && <LoginModal onClose={()=>setShowLogin(false)} onLoggedIn={(s)=>{setSession(s); setShowLogin(false);}} />}

      {tab === 'submit' && session && <SubmitTipForm session={session} onDone={()=>setTab('browse')} />}
      {tab === 'whatsapp' && session && session.role==='מאשר' && <ExcelImport session={session} />}
      {tab === 'approve' && session && session.role==='מאשר' && <ApprovalQueue session={session} />}
      {tab === 'manage' && session && session.role==='מאשר' && <ManageTips session={session} />}

      {tab === 'browse' && loadingTips && <LoadingScreen />}
      {tab === 'browse' && !loadingTips && (
        <div className="flex-1 flex flex-col">
          <div className="px-4 pt-4">
            <input type="text" placeholder="חפשו טיפ..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}
              className="w-full bg-white text-gray-800 px-4 py-4 rounded-2xl text-base font-semibold placeholder-gray-400 focus:outline-none"
              style={{border:"2.5px solid #0284c7", boxShadow:"0 3px 0px #065a8c"}} />
          </div>
          {!searchQuery && (
            <div className="px-4 pt-4">
              <div className="flex flex-wrap gap-2 justify-center">
                {CATS.map(c => (
                  <button key={c.key} onClick={()=>setSelectedCat(selectedCat===c.key?null:c.key)}
                    className={`px-3 py-2 rounded-full text-xs font-bold btn-3d border-2 ${selectedCat===c.key?'bg-sky-600 text-white border-sky-600':'bg-sky-50 text-blue-900 border-sky-600'}`}>
                    {c.label}
                  </button>
                ))}
              </div>
              {submitters.length > 0 && (
                <div className="mt-3 flex items-center justify-center gap-2">
                  <label className="text-xs font-bold text-blue-900">סינון לפי מציע/ה:</label>
                  <select value={selectedSubmitter} onChange={e=>setSelectedSubmitter(e.target.value)}
                    className="px-3 py-2 rounded-full text-xs font-bold border-2 border-sky-600 text-blue-900 bg-sky-50">
                    <option value="">הכל</option>
                    {submitters.map(name => <option key={name} value={name}>{name}</option>)}
                  </select>
                </div>
              )}
            </div>
          )}
          <div className="px-4 pt-4 pb-8 space-y-3">
            {filtered.map(t => {
              const isOpen = expanded === t.id;
              return (
                <div key={t.id} className={`rounded-3xl overflow-hidden transition-shadow ${isOpen?'shadow-md':'shadow-sm'}`} style={{background:'#fff'}}>
                  <button onClick={()=>setExpanded(isOpen?null:t.id)} className="w-full text-right p-4 flex items-center justify-between gap-3">
                    <div>
                      <span className="text-[11px] bg-sky-50 text-sky-700 px-2 py-0.5 rounded-full font-bold">{catLabel(t.category)}</span>
                      <p className="font-extrabold text-blue-900 mt-1.5 leading-snug">{t.name}</p>
                    </div>
                    <span className={`text-sky-600 text-lg shrink-0 transition-transform ${isOpen?'rotate-180':''}`}>⌄</span>
                  </button>
                  {isOpen && (
                    <div className="step-fade mx-3 mb-3 rounded-2xl p-4 space-y-2.5" style={{background:'#eaf4fb'}}>
                      {t.essence && <p className="text-sm text-gray-700 leading-relaxed"><Linkify text={t.essence} /></p>}
                      {(t.steps||[]).length > 0 && (
                        <ol className="list-decimal pr-5 text-sm text-gray-700 space-y-1.5">
                          {(t.steps||[]).map((s,i)=><li key={i} className="leading-relaxed"><Linkify text={s} /></li>)}
                        </ol>
                      )}
                      {t.uses && <p className="text-sm text-gray-600 leading-relaxed"><b className="text-blue-900">שימושים: </b><Linkify text={t.uses} /></p>}
                      {t.infographicUrl && <a href={t.infographicUrl} target="_blank" rel="noopener" className="text-sm text-sky-700 underline block">📎 אינפוגרפיקה מצורפת</a>}
                      <p className="text-xs text-gray-400 pt-1">מציע/ה: {t.submitter}</p>
                    </div>
                  )}
                </div>
              );
            })}
            {filtered.length===0 && <p className="text-center text-gray-400 py-8">לא נמצאו טיפים מתאימים</p>}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
