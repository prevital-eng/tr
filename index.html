<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>גימלאטק - עברנו לכתובת חדשה</title>
<meta http-equiv="refresh" content="8; url=https://gimlatech.github.io/tr/">
<link rel="canonical" href="https://gimlatech.github.io/tr/">
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7f5;
    color: #222;
    margin: 0;
    padding: 40px 16px;
    text-align: center;
    font-size: 22px;
    line-height: 1.6;
  }
  h1 { font-size: 30px; color: #2e7d32; margin-bottom: 8px; }
  .address {
    display: inline-block;
    margin: 16px 0;
    padding: 12px 20px;
    background: #fff;
    border: 2px solid #2e7d32;
    border-radius: 12px;
    font-size: 26px;
    font-weight: bold;
    direction: ltr;
    word-break: break-all;
  }
  .note { color: #555; }
  .button {
    display: inline-block;
    margin-top: 24px;
    padding: 16px 32px;
    background: #2e7d32;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: 24px;
  }
</style>
</head>
<body>
  <h1>מעבירים אתכם לכתובת החדשה</h1>
  <p>האפליקציה של גימלאטק עברה לכתובת:</p>
  <div class="address">gimlatech.github.io/tr</div>
  <p class="note">מומלץ לשמור את הכתובת החדשה.</p>
  <p>המעבר יתבצע אוטומטית בעוד <span id="count">6</span> שניות.</p>
  <a class="button" id="go" href="https://gimlatech.github.io/tr/">כניסה עכשיו</a>
<script>
  (function () {
    var NEW_BASE = 'https://gimlatech.github.io/tr';
    var parts = location.pathname.split('/');
    var rest = parts.slice(2).join('/');
    var target = NEW_BASE + '/' + rest + location.search + location.hash;
    document.getElementById('go').href = target;
    var seconds = 6;
    var el = document.getElementById('count');
    var timer = setInterval(function () {
      seconds--;
      el.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        location.replace(target);
      }
    }, 1000);
  })();
</script>
</body>
</html>
